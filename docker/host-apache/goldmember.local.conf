# Host-side Apache reverse proxy → Docker container.
# Installed by docker/host-apache/setup-local-hosts.sh into /etc/apache2/sites-available/.
# ProxyPreserveHost keeps the Host header so Yii builds absolute URLs with *.goldmember.local.

<VirtualHost *:80>
    ServerName goldmember.local
    ServerAlias www.goldmember.local

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/goldmember_error.log
    CustomLog ${APACHE_LOG_DIR}/goldmember_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.goldmember.local

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/admin.goldmember_error.log
    CustomLog ${APACHE_LOG_DIR}/admin.goldmember_access.log combined
</VirtualHost>
